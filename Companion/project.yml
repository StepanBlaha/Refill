name: RefillCompanion
options:
  bundleIdPrefix: cz.stepanblaha
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: FW5CYB98R7
targets:
  RefillCompanion:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - ../Sources/Refill/Mascot.swift
      - ../Sources/Refill/Voice.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.stepanblaha.refill.companion
        PRODUCT_NAME: Refill
        INFOPLIST_FILE: App/Info.plist
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Refill
        NSLocalNetworkUsageDescription: Refill talks to your Mac on the local network to show your AI usage.
        NSBonjourServices: ["_http._tcp"]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
schemes:
  RefillCompanion:
    build:
      targets:
        RefillCompanion: all
